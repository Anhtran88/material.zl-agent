[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-material-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright>=1.48,<2"]

[project.scripts]
zalo-poc = "material_agent.poc:main"

[tool.setuptools.packages.find]
where = ["src"]
